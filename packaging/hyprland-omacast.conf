# Omacast floating window for Omarchy / Hyprland
#
# Do not copy this into place automatically. Source it from your Hyprland
# config when you want the dedicated Alacritty window (class omacast-app)
# to float, center, pin, and size to 800x500.
#
# Omarchy typically uses ~/.config/hypr/hyprland.conf. Add:
#
#   source = ~/apps/omacast/packaging/hyprland-omacast.conf
#
# or copy these rules into a snippet you already source.

windowrulev2 = float, class:^(omacast-app)$
windowrulev2 = center, class:^(omacast-app)$
windowrulev2 = pin, class:^(omacast-app)$
windowrulev2 = size 800 500, class:^(omacast-app)$
